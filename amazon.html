<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SandeshShop</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  
  <nav>
    <div class="logo">ShopEasy</div>

    <input type="text" placeholder="Search products..." />

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Cart</a>
    </div>
  </nav>

  
  <section class="banner">
    <h1>Big Summer Sale</h1>
    <p>Up to 50% off on electronics</p>
    <button>Shop Now</button>
  </section>

  
  <section class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" alt="">
      <h3>Smartphone</h3>
      <p>$299</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="">
      <h3>Watch</h3>
      <p>$99</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="">
      <h3>Headphones</h3>
      <p>$59</p>
      <button>Add to Cart</button>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
